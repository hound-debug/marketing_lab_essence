<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>실서비스 문제 탐지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* PC 우선 3단: 위 막대(팀·요약) / 왼쪽 문제 목록 / 오른쪽 상세(재생기+행동 기록 | AI 판독) — Sentry·Linear·PostHog 패턴 */
:root{
  --bg:#f4f5f8; --panel:#ffffff; --sunk:#f7f8fa; --line:#e3e6ec; --fg:#1b1f2a; --muted:#69707f;
  --brand:#2c6bff; --brand-soft:#e8efff; --deep:#1d47b8;
  --hot:#d6453d; --hot-soft:#fdecea; --warn:#b26b00; --warn-soft:#fff3dc; --ok:#23854a; --ok-soft:#e5f5ea; --idle:#8a90a0; --idle-soft:#eef0f4;
  --sans:"Pretendard Variable",Pretendard,"Noto Sans KR",-apple-system,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101318; --panel:#171b22; --sunk:#12161c; --line:#2a303b; --fg:#e7eaf1; --muted:#9aa2b4;
  --brand:#5b8dff; --brand-soft:#1d2a47; --deep:#a9c2ff;
  --hot:#ff7a70; --hot-soft:#3a1f1f; --warn:#e6b75a; --warn-soft:#3a2f17; --ok:#5cc97a; --ok-soft:#1b3324; --idle:#8a90a0; --idle-soft:#242a35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101318; --panel:#171b22; --sunk:#12161c; --line:#2a303b; --fg:#e7eaf1; --muted:#9aa2b4;
  --brand:#5b8dff; --brand-soft:#1d2a47; --deep:#a9c2ff;
  --hot:#ff7a70; --hot-soft:#3a1f1f; --warn:#e6b75a; --warn-soft:#3a2f17; --ok:#5cc97a; --ok-soft:#1b3324; --idle:#8a90a0; --idle-soft:#242a35; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.55}
h1,h2,h3,p{margin:0}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-variant-numeric:tabular-nums} .small{font-size:12.5px}
button{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;min-height:620px}
/* 위 막대 */
.top{display:flex;align-items:center;gap:16px;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;white-space:nowrap}
.brand .logo{width:24px;height:24px;border-radius:6px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:11px}
.demo{font-size:11.5px;font-weight:500;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:999px;white-space:nowrap}
.teams{display:flex;gap:2px;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.teams button{border:0;background:none;border-radius:7px;padding:5px 11px;cursor:pointer;font-size:13.5px;white-space:nowrap}
.teams button .n{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-left:4px}
.teams button[aria-selected="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700}
.teams button[aria-selected="true"] .n{color:var(--hot)}
.views{margin-left:auto;display:flex;gap:4px}
.views button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
.views button[aria-pressed="true"]{border-color:var(--brand);color:var(--deep);background:var(--brand-soft)}
/* 본문 2단 */
.body{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.list{border-right:1px solid var(--line);background:var(--panel);overflow-y:auto;min-height:0}
.lhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:4px;position:sticky;top:0;background:var(--panel);z-index:1}
.lhead h2{font-size:15px}
.lhead .kpi{font-size:12.5px;color:var(--muted)} .lhead .kpi b{color:var(--fg)}
.group{padding:10px 16px 4px;font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.row{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:none;padding:10px 14px 10px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.row:hover{background:var(--sunk)}
.row[aria-selected="true"]{background:var(--brand-soft);border-left-color:var(--brand)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;background:var(--idle)}
.dot.높음{background:var(--hot)} .dot.중간{background:var(--warn)} .dot.obs{background:transparent;border:2px solid var(--idle)}
.row .t{font-weight:700;font-size:13.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .m{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:4px;font-size:12px;color:var(--muted);align-items:center}
.row .done{color:var(--ok);font-weight:700}
.badge{display:inline-flex;align-items:center;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px;white-space:nowrap}
.b-new{background:var(--brand-soft);color:var(--deep)} .b-rep{background:var(--warn-soft);color:var(--warn)} .b-jira{background:var(--ok-soft);color:var(--ok)}
.b-obs{background:transparent;color:var(--muted);border:1px solid var(--line)} .b-exp{background:var(--idle-soft);color:var(--fg)}
.b-높음{background:var(--hot-soft);color:var(--hot)} .b-중간{background:var(--warn-soft);color:var(--warn)} .b-낮음{background:var(--idle-soft);color:var(--idle)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
.lfoot{padding:12px 16px;font-size:12px;color:var(--muted)}
/* 상세 */
.detail{overflow-y:auto;min-height:0;padding:18px 22px 40px}
.dhead{display:grid;gap:8px;margin-bottom:14px}
.dhead h1{font-size:20px;line-height:1.35;letter-spacing:-.01em}
.dhead .imp{font-size:13.5px;color:var(--muted)} .dhead .imp b{color:var(--fg)}
.warn{font-size:13px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 10px;width:fit-content}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:16px}
.bar button,.bar select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--fg)}
.bar button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.bar button[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.bar button.no[aria-pressed="true"]{background:var(--hot-soft);border-color:var(--hot);color:var(--hot)}
.bar .sep{width:1px;height:20px;background:var(--line);margin:0 4px}
.bar .judge{margin-left:auto;display:flex;gap:6px;align-items:center}
.grid2{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.15fr);gap:18px;align-items:start}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pane h3{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:12px 14px 0}
/* 재생기 */
.player{display:grid;gap:0}
.stage{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;padding:14px;align-items:start}
.stage .phone svg{width:100%;height:auto;display:block}
.now{display:grid;gap:6px;align-content:start}
.now .ts{font-family:var(--mono);font-size:22px;font-weight:500}
.now .ev{font-size:14px;font-weight:700}
.now .pg{font-family:var(--mono);font-size:12px;color:var(--muted)}
.now a{font-size:13px;color:var(--deep)}
.ctrl{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:0 14px 12px}
.ctrl button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.scrub{position:relative;height:30px}
.scrub input{position:absolute;inset:0;width:100%;margin:0;accent-color:var(--brand);background:transparent}
.scrub .mk{position:absolute;top:1px;width:4px;height:9px;border-radius:2px;background:var(--hot);transform:translateX(-2px);pointer-events:none}
.scrub .mk.err{background:var(--hot);height:12px}
.recs{display:flex;gap:8px;padding:0 14px 14px;flex-wrap:wrap}
.rec{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:12.5px;text-align:left;display:grid;gap:0}
.rec[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.rec small{color:var(--muted);font-family:var(--mono);font-size:11px}
.events{list-style:none;margin:0;padding:6px 6px 8px;border-top:1px solid var(--line);max-height:300px;overflow-y:auto}
.events li{display:grid;grid-template-columns:48px 14px minmax(0,1fr);gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.events li:hover{background:var(--sunk)}
.events li .t{font-family:var(--mono);color:var(--muted);font-size:12px}
.events li .i{width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--line)}
.events li.sig .i{background:var(--hot)}
.events li.cur{background:var(--brand-soft)}
.events li.key{font-weight:700}
.events li.key .t{color:var(--hot)}
/* AI 판독 */
.ai{display:grid;gap:0}
.ai section{padding:12px 14px;border-top:1px solid var(--line);display:grid;gap:4px}
.ai section:first-of-type{border-top:0}
.ai .lbl{font-size:12px;font-weight:700;color:var(--muted)}
.ai .fix{background:var(--ok-soft);border-radius:8px;margin:0 10px;border-top:0}
.ai .fix .lbl{color:var(--ok)}
.ai .fix{margin:6px 10px}
.ai .fix p{font-size:14.5px;font-weight:500}
.ai .raw{font-size:12.5px;color:var(--muted)}
.ai dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:13px}
.ai dt{color:var(--muted)} .ai dd{margin:0}
/* 선별 기준 보기 */
.lab{padding:20px 22px;overflow-y:auto}
.labgrid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start;margin-top:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.ctrlp{display:grid;gap:12px}
.ctrlp .item{display:grid;gap:2px}
.ctrlp label{display:flex;justify-content:space-between;font-size:13px}
.ctrlp input[type=range]{width:100%;accent-color:var(--brand)}
.ctrlp .chk{display:flex;gap:8px;font-size:13px}
.ctrlp button.reset{border:1px solid var(--line);background:none;border-radius:8px;padding:5px 10px;cursor:pointer;width:fit-content}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
.pill{display:inline-flex;font-size:12px;font-weight:500;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-sig{background:var(--hot-soft);color:var(--hot)} .p-exp{background:var(--brand-soft);color:var(--deep)} .p-idle,.p-low{background:var(--idle-soft);color:var(--idle)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:620px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap} td.mono{white-space:nowrap}
td.num{text-align:right;font-family:var(--mono)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--idle-soft);font-family:var(--mono);white-space:nowrap}
.chip.on{background:var(--hot-soft);color:var(--hot)}
.rowbtn{background:none;border:0;color:var(--deep);cursor:pointer;padding:0;font-family:var(--mono)}
.note{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--fg);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:8px;z-index:40;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);padding:18px;width:min(620px,calc(100% - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog textarea{width:100%;min-height:340px;font-family:var(--mono);font-size:12.5px;line-height:1.5;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--sunk);color:var(--fg)}
dialog .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
dialog button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;cursor:pointer}
dialog button.primary{background:var(--brand);border-color:var(--brand);color:#fff}
@media (max-width:1180px){.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{height:auto;display:block}
  .body{grid-template-columns:1fr}
  .list{border-right:0;max-height:none}
  .detail,.lab{overflow:visible;padding:16px}
  .stage{grid-template-columns:140px minmax(0,1fr)}
  .labgrid{grid-template-columns:1fr}
  .views{margin-left:0}
}
</style><style>
.branch{display:flex;flex-wrap:wrap;gap:2px;max-width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px}
.branch button{border:0;background:none;border-radius:7px;padding:5px 12px;cursor:pointer;font-size:13px;white-space:nowrap}
.branch button[aria-pressed="true"]{background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.filters select{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:8px;padding:4px 8px;background:var(--panel);color:var(--fg)}
.big{font-size:15px} .big b{font-size:20px;font-family:var(--mono)}
.bars{display:grid;gap:4px;margin-top:4px}
.bar1{display:grid;grid-template-columns:minmax(120px,190px) 1fr 44px;gap:8px;align-items:center;font-size:12.5px}
.bar1 .tr{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden}
.bar1 .tr i{display:block;height:100%;background:var(--brand);border-radius:5px}
.bar1 .tr i.hot{background:var(--hot)}
.bar1 .v{text-align:right;font-family:var(--mono)}
.chips2{display:flex;flex-wrap:wrap;gap:4px}
.chip2{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);border:1px solid var(--line);cursor:pointer;font-family:var(--mono)}
.chip2[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--deep)}
.realbox{font-size:13px;background:var(--brand-soft);color:var(--deep);border-radius:8px;padding:8px 10px}
.shotview{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;padding:14px;align-items:start}

.thumbs{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 12px}

.thumbs button[aria-pressed="true"]{border-color:var(--brand)}
.thumbs img{width:100%;display:block;border-radius:6px}
.journey{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13px}
.journey li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;padding:4px 6px;border-radius:6px}
.journey li .t{font-family:var(--mono);color:var(--muted);font-size:12px}
.journey li.sig{background:var(--hot-soft)}
.journey li.sig .t{color:var(--hot)}
.page{padding:20px 22px 48px;overflow-y:auto;min-height:0}
.page h2{font-size:18px} .page .lead{color:var(--muted);margin:4px 0 14px;font-size:13.5px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl th{background:var(--sunk);font-size:12px;color:var(--muted);font-weight:500}
.tbl td.n{text-align:right;font-family:var(--mono);white-space:nowrap}
.up{color:var(--ok)} .down{color:var(--hot)} .flat{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.fcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.fcard h3{font-size:15px;line-height:1.4}
.fcard .meta{font-size:12px;color:var(--muted)}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.kv3 div{background:var(--sunk);border-radius:8px;padding:6px 8px;display:grid}
.kv3 small{font-size:11px;color:var(--muted)} .kv3 b{font-family:var(--mono);font-size:15px}
.cav{font-size:12px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:3px 8px;width:fit-content}
.funnels{display:grid;grid-template-columns:repeat(auto-fill,minmax(460px,1fr));gap:12px}
.fun{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.fun h3{font-size:15px;margin-bottom:8px}
.frow{display:grid;grid-template-columns:120px 1fr 1fr;gap:10px;align-items:center;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.frow .cell{display:grid;gap:2px}
.frow .tr{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.frow .tr i{display:block;height:100%;background:var(--brand)}
.frow .tr i.new{background:var(--warn)}
.frow small{font-family:var(--mono);color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(320px,1fr);gap:14px;align-items:start}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}


.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 16px}
.how div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.how b{display:block;font-size:14px;margin-bottom:2px}
.teamtabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.teamtabs button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.teamtabs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.sgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:1000px){.sgrid{grid-template-columns:1fr}}
.sbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px}
.sbox h3{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.sitem{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.sitem:first-of-type{border-top:0}
.sitem:hover .st{text-decoration:underline}
.sitem .st{font-weight:700;font-size:13.5px}
.sitem .sm{font-size:12px;color:var(--muted)}
.limits{font-size:12.5px;color:var(--muted);line-height:1.8;margin-top:16px}

function spark(vals,{w=260,h=54,mark=null,days=null,color="var(--brand)",partial=true}={}){
  const n=vals.length, mx=Math.max(1,...vals); const bw=w/n;
  const bars=vals.map((v,i)=>`<rect x="${i*bw+1}" y="${h-14-(v/mx)*(h-20)}" width="${Math.max(1,bw-2)}" height="${(v/mx)*(h-20)}" fill="${color}" opacity="${partial&&i===n-1?.35:1}"><title>${days?days[i]:""} ${fmtN(v)}</title></rect>`).join("");
  const m = mark!=null?`<line x1="${mark*bw}" x2="${mark*bw}" y1="0" y2="${h-12}" stroke="var(--hot)" stroke-dasharray="3 2"/><text x="${mark*bw+3}" y="9" font-size="9" fill="var(--hot)">도입</text>`:"";
  const peak = vals.map((v,i)=>[v,i]).filter(([v])=>v>0).sort((p,q)=>q[0]-p[0]).filter((p,k,arr)=>arr.slice(0,k).every(z=>Math.abs(z[1]-p[1])>2)).slice(0,2).map(([v,i])=>`<text x="${i*bw+bw/2}" y="${h-16-(v/mx)*(h-20)}" font-size="9" text-anchor="middle" fill="var(--fg)">${days?days[i].slice(5).replace("-","/")+" ":""}${fmtN(v)}</text>`).join("");
  const lab = days?`<text x="0" y="${h-2}" font-size="9" fill="var(--muted)">${days[0].slice(5)}</text><text x="${w}" y="${h-2}" font-size="9" fill="var(--muted)" text-anchor="end">${days[n-1].slice(5)}${partial?" (오늘·부분)":""}</text>`:"";
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px" role="img" aria-label="일별 추이">${bars}${m}${h>=80?peak:""}${lab}</svg>`;
}

  document.getElementById("v-funnel").innerHTML=`<h2>로그인 고객 퍼널 · 신규 vs 기존</h2>
    <p class="lead">${gTeam?`<b>${esc(gTeam)}</b> 퍼널만 보여요(위쪽 「전체」로 모두 보기). `:""}${gTeam&&!TEAM_FUN[gTeam]?"이 팀은 로그로 묶은 퍼널이 아직 없어요. ":""}각 단계에 도달한 사람 수(이번 주 = 11/20~26, 오늘 제외 · 지난주 = 11/13~19). 막대는 1단계 대비 비율, 괄호는 바로 앞 단계 대비 전환율, 화살표는 지난주 대비 변화예요. 신규 = 가입 7일 이내.</p>
    ${order.length?`<div class="legend"><span><i style="background:var(--warn)"></i>신규</span><span><i style="background:var(--brand)"></i>기존</span></div>`:`<div class="realbox">${esc(gTeam)} 퍼널은 아직 로그로 묶지 않았어요. 예: ${esc(FUN_EX[gTeam]||"진입 → 핵심 행동 → 완료")} — 이 단계로 묶을지 알려 주시면 추가합니다.</div>`}
    <div class="funnels">${order.map(k=>{const st=F[k];const s1n=st[0]["이번주_신규"]||1,s1e=st[0]["이번주_기존"]||1;
      return `<div class="fun"><h3>${esc(k)}</h3>${st.map((s,i)=>{const p=st[i-1];
        const cn=p?Math.round(s["이번주_신규"]/Math.max(1,p["이번주_신규"])*100):null, ce=p?Math.round(s["이번주_기존"]/Math.max(1,p["이번주_기존"])*100):null;
        return `<div class="frow"><span>${s.step}. ${esc(s.name)}</span>
          <span class="cell"><span class="tr"><i class="new" style="width:${Math.min(100,s["이번주_신규"]/s1n*100)}%"></i></span><small>${fmtN(s["이번주_신규"])}${cn!=null?` (${cn}%${cn>100?" · 앞 단계보다 많음, 다른 경로":""})`:""} ${chg(pct(s["이번주_신규"],s["지난주_신규"]))}</small></span>
          <span class="cell"><span class="tr"><i style="width:${Math.min(100,s["이번주_기존"]/s1e*100)}%"></i></span><small>${fmtN(s["이번주_기존"])}${ce!=null?` (${ce}%${ce>100?" · 앞 단계보다 많음, 다른 경로":""})`:""} ${chg(pct(s["이번주_기존"],s["지난주_기존"]))}</small></span></div>`}).join("")}</div>`}).join("")}</div>
    <p class="muted small" style="margin-top:8px">단계는 그 주에 해당 행동을 한 사람 수라 순서가 꼭 이어지지는 않아요(예: 고지서 「계약 정보」는 신규가 다른 경로로 건너뛰는 경우가 많음).</p>`;
}
// ───── 신규 기능
function renderFeatures(){
  const F=gTeam?D.features.filter(f=>f.team===gTeam):D.features;
  document.getElementById("v-features").innerHTML=`<h2>제품별 신규 기능과 영향 (최근 30일)</h2>
    <p class="lead">${gTeam?`<b>${esc(gTeam)}</b> 기능 ${F.length}개만 보여요(위쪽 「전체」로 모두 보기). `:""}최근 30일 안에 로그에 처음 나타난 행동 기록으로 새로 배포된 기능을 찾았어요. 11/19에 행동 종류가 701 → 749개로 늘어 큰 배포가 있었어요. 연결 지표는 도입 전 7일 평균 vs 도입 후 평균(오늘 제외)이고, 다른 변화와 겹치면 주의 문구를 붙였어요. <b>전후 비교는 인과가 아니에요.</b></p>
    <div class="cards">${F.map(f=>{const i=f.days.indexOf(f.launch);const m=f.metric;
      return `<article class="fcard"><div class="meta">${f.launch.slice(5).replace("-","/")} 도입 · ${esc(f.team)}</div><h3>${esc(f.name)}</h3>
        <div class="kv3"><div><small>${esc(f.labels[0]||"본 사람")}(일별 합, 중복 포함)</small><b>${fmtN(f.view_sum)}</b></div>${f.click_sum!=null&&f.labels[1]!==""?`<div><small>${esc(f.labels[1]||"누른 사람")}</small><b>${fmtN(f.click_sum)}</b></div><div><small>${esc(f.labels[2]||"누른 비율")}</small><b>${f.ctr!=null?f.ctr+"%":"-"}</b></div>`:""}</div>
        ${f.close_sum?`<p class="small muted">닫은 사람 ${fmtN(f.close_sum)}</p>`:""}
        ${spark(f.view.slice(Math.max(0,i-3)),{w:300,h:44,days:f.days.slice(Math.max(0,i-3)),mark:Math.min(3,i)})}
        ${m?`<div><p class="small">연결 지표 · <b>${esc(m.name)}</b>: 하루 평균 ${fmtN(m.before)} → ${fmtN(m.after)} ${m.change!=null?chg(Math.round(m.change)):""}</p>${spark(m.series,{w:300,h:44,days:f.days,mark:i,color:"var(--ok)"})}</div>`:`<p class="small muted">연결 지표 없음(노출·클릭만 측정)</p>`}
        ${f.guard?`<p class="small">함께 볼 지표 · ${esc(f.guard.name)}: ${fmtN(f.guard.before)} → <b class="down">${fmtN(f.guard.after)}</b>명/일${f.related_issue?` <button class="linkish" data-goissue="${f.related_issue}" data-gobr="기가입">관련 문제 보기 →</button>`:""}</p>`:""}
        ${(f.caveats||[]).map(c=>`<span class="cav">⚠ ${esc(c)}</span>`).join("")}</article>`}).join("")}</div>`;
}
// ───── 고객 100명
let selAgent=null;
function renderAgents(){
  const A=gTeam?D.agents.filter(z=>(TEAM_SEG[gTeam]||[]).includes(z.seg)):D.agents; const a=(selAgent&&A.find(z=>z.id===selAgent))?AG[selAgent]:A[0];
  if(!a){document.getElementById("v-agents").innerHTML=`<h2>고객 에이전트 여정</h2><p class="scope warn2">${esc(gTeam)} 화면은 이번 주행에서 에이전트가 들어가지 않았어요(로그인 필요 화면). 위쪽 「전체」로 100명 모두 보기.</p>`;return;}
  const oc=o=>o==="성공"?"p-exp":o==="로그인 벽"?"p-sig":"p-low";
  document.getElementById("v-agents").innerHTML=`<h2>고객 에이전트 100명 여정</h2>
    <p class="lead">실제 비로그인 트래픽 비중대로 입구를 배치했어요(실거주리뷰 40 · 단기임대 20 · 커뮤니티 15 · 환급 랜딩 10 · 자리페이 랜딩 10 · 홈 5). 성향: 급함(반응 없으면 연타·바로 뒤로) · 꼼꼼(스크롤하며 찾음) · 탐색(아무거나 눌러 봄). 가입·결제·전송은 하지 않았고, 분석·광고 스크립트는 막아 실제 지표에 섞이지 않게 했어요.</p>
    <div class="split"><div style="max-height:70vh;overflow:auto"><table class="tbl"><thead><tr><th>ID</th><th>입구</th><th>기기·성향</th><th>목표</th><th>결과</th><th>겪은 문제</th></tr></thead><tbody>
    ${A.map(x=>`<tr data-arow="${x.id}" style="cursor:pointer;${x.id===a.id?"background:var(--brand-soft)":""}"><td class="mono">${x.id}</td><td>${esc(x.seg)}</td><td class="small">${esc(x.device)} · ${esc(x.style)}</td><td class="small">${esc(x.goal)}</td><td><span class="pill ${oc(x.outcome)}">${esc(x.outcome)}</span></td><td class="small">${[...new Set(x.signals.map(s=>s.type))].map(esc).join(", ")||"-"}</td></tr>`).join("")}</tbody></table></div>
    <div class="pane"><h3>${a.id} 여정</h3><div style="padding:10px 14px"><p class="small">${esc(a.seg)} · ${esc(a.device)} · ${esc(a.style)} · ${Object.entries(a.persona||{}).map(([k,v])=>esc(k+" "+v)).join(" · ")}</p>
      <p class="small">목표 「${esc(a.goal)}」 → <b>${esc(a.outcome)}</b> · ${a.durationSec}초 · 입구 <span class="mono">${esc((a.entry||"").replace("https://",""))}</span></p>
      <ol class="journey" style="margin-top:8px">${a.timeline.map(l=>`<li class="${/변화 없음|가려|팝업|로그인|찾지 못|빈 페이지|연타|개인정보/.test(l)?"sig":""}"><span class="t">${l.slice(0,5)}</span><span>${esc(l.slice(6))}</span></li>`).join("")}</ol>
      <div class="thumbs" style="padding:10px 0 0">${a.signals.filter(s=>s.shot).map(s=>`<a href="${SB}${esc(s.shot)}" target="_blank" rel="noopener" style="width:110px"><img src="${SB}${esc(s.shot)}" alt="${esc(s.type)} 화면" loading="lazy" style="width:100%;border-radius:8px;border:1px solid var(--line)"><span class="small">${esc(s.t)} ${esc(s.type)}</span></a>`).join("")}</div></div></div></div>`;
}
// ───── 리토
function renderRito(){
  const R=D.rito;
  document.getElementById("v-rito").innerHTML=`<h2>리토(사내 AI)와 함께 보기</h2>
    <p class="lead">${esc(R.source)}</p>
    <table class="tbl"><thead><tr><th>팀</th><th>지표</th><th style="text-align:right">변화</th><th>비교 기간</th></tr></thead><tbody>
    ${R.items.filter(i=>!gTeam||i.team===gTeam||i.team==="전체").map(i=>`<tr><td>${esc(i.team)}</td><td>${esc(i.metric)}</td><td class="n">${/^\+/.test(i.change)?`<span class="down">${esc(i.change)}</span>`:`<span class="down">${esc(i.change)}</span>`}</td><td class="small">${esc(i.window)}</td></tr>`).join("")}</tbody></table>
    <p class="small muted" style="margin-top:8px">${esc(R.deploy_note)}</p>
    <h2 style="margin-top:24px">리토로 더 고도화할 수 있는 것</h2>
    <ul class="small" style="line-height:1.8">${R.next.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`;

// ───── 공통
function setView(v){curView=v;syncUrl();document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.view===v)));
  document.querySelectorAll(".vw").forEach(s=>{const on=s.id==="v-"+v; s.hidden=!on; if(s.id==="v-issues") s.style.display=on?"grid":"none";});
  ({summary:renderSummary,traffic:renderTraffic,funnel:renderFunnel,features:renderFeatures,agents:renderAgents,rito:renderRito})[v]?.();}
document.addEventListener("click",e=>{const t=e.target;
  const vb=t.closest("[data-view]"); if(vb){if(vb.dataset.crumbteam){gTeam=vb.dataset.crumbteam;renderTeamBar();}setView(vb.dataset.view);return;}
  const gtb=t.closest("[data-gteam]"); if(gtb){gTeam=gtb.dataset.gteam||null;renderTeamBar();curId=null;
    tGroup=TEAM_GROUP[gTeam]||"기존";
    if(branch!=="전체"&&!ISS().length){const o=branch==="신규"?"기가입":"신규";if((o==="신규"?D.issuesNew:D.issuesExisting).some(x=>inTeam(x,gTeam))){branch=o;}}
    renderFilters();selIssue(ISS()[0]?.id);setView(curView);return;}
  const gi=t.closest("[data-goissue]"); if(gi){branch="전체";renderFilters();setView("issues");selIssue(gi.dataset.goissue);return;}
  const bb=t.closest("[data-branch]"); if(bb){branch=bb.dataset.branch;renderFilters();selIssue(ISS()[0]?.id);syncUrl();return;}
  const ib=t.closest("[data-issue]"); if(ib){selIssue(ib.dataset.issue);return;}
  const sb=t.closest("[data-shot]"); if(sb){curShot=+sb.dataset.shot;curAgent=ISS().find(y=>y.id===curId).shots[curShot].agent;renderDetail();return;}
  const ab=t.closest("[data-agent]"); if(ab){curAgent=ab.dataset.agent;const x=ISS().find(y=>y.id===curId);const k=x.shots.findIndex(s=>s.agent===curAgent);if(k>=0)curShot=k;renderDetail();return;}
  const as=t.closest("[data-ashot]"); if(as){window.open(SB+as.dataset.ashot,"_blank","noopener");return;}
  const tg=t.closest("[data-tg]"); if(tg){tGroup=tg.dataset.tg;renderTraffic();return;}
  const ar=t.closest("[data-arow]"); if(ar){selAgent=ar.dataset.arow;renderAgents();return;}
  if(t.closest("[data-jira]")){const x=ISS().find(y=>y.id===curId);const ta=document.getElementById("jiraTxt");ta.value=jiraText(x);document.getElementById("jira").showModal();ta.scrollTop=0;document.getElementById("jiraCopy").focus();setS("act:"+x.id,"jira");renderList();return;}
  const ac=t.closest("[data-act]"); if(ac){const k="act:"+curId;const v=getS(k)===ac.dataset.act?null:ac.dataset.act;setS(k,v);renderList();renderDetail();if(v==="send")toast("실제로는 담당 팀 채널에 스레드로 올리고 담당자를 태그합니다.");if(v==="known")toast("내일부터 이 문제는 「이미 앎」으로 아래로 내립니다.");return;}
  const fbn=t.closest('[data-k="n"]'); if(fbn){openFB();return;}
  const fb=t.closest("[data-k]"); if(fb){const k="fb:"+curId;const v=getS(k)===fb.dataset.k?null:fb.dataset.k;setS(k,v);renderDetail();toast(v==="n"?"틀린 판독은 다음 판독 기준에 반영합니다.":"고마워요.");return;}
});
document.addEventListener("keydown",e=>{if(document.getElementById("jira").open||(e.target.matches&&e.target.matches("input,select,textarea"))||document.getElementById("v-issues").hidden) return;
  const L=ISS().map(x=>x.id),p=L.indexOf(curId);
  if(e.key==="ArrowDown"){e.preventDefault();selIssue(L[Math.min(p+1,L.length-1)]);} else if(e.key==="ArrowUp"){e.preventDefault();selIssue(L[Math.max(p-1,0)]);}
  else if(e.key==="j"||e.key==="J"){document.querySelector("[data-jira]")?.click();}});
function curIssue(){return [...D.issuesNew,...D.issuesExisting].find(y=>y.id===curId);}
function openFB(){const x=curIssue();if(!x)return;document.getElementById("fbTitle").textContent=`[${x.team.replace(/\(.*\)/,"")}] ${x.title}`;
  document.getElementById("fbMode").textContent=MCP?"「전달하기」를 누르면 노션 「PO 의견」에 바로 저장돼요(작성자 = 나). 매주 목요일 13시에 반영하고 노션 「처리 현황」에서 처리 완료로 바뀌어요.":"의견 전달은 사내 Claude 페이지에서 돼요. 「전달하기」를 누르면 적은 내용이 복사되고 사내 페이지가 열려요. 같은 문제의 ❌에서 붙여 넣어 전달해 주세요.";
  document.getElementById("fbIntent").value="";document.getElementById("fbdlg").showModal();}
document.getElementById("fbCancel").addEventListener("click",()=>document.getElementById("fbdlg").close());
const FBERR={needs_reauth:"노션 연결이 만료됐어요. claude.ai 설정 → 커넥터에서 노션을 다시 연결해 주세요.",server_not_connected:"claude.ai에 노션이 연결돼 있지 않아요. 설정 → 커넥터에서 노션을 추가해 주세요.",selection_required:"노션 연결을 하나 골라 주세요(화면 위 안내).",not_in_manifest:"이 페이지의 노션 저장을 허용하지 않았어요. 페이지 메뉴 → 권한에서 켜 주세요.",approval_required:"노션 저장 허용이 필요해요. claude.ai에서 열었을 때 허용을 눌러 주세요.",blocked_by_policy:"회사 정책으로 노션 저장이 막혀 있어요.",tool_error:"노션이 저장을 거절했어요."};
let fbBusy=false;
document.getElementById("fbSave").addEventListener("click",async()=>{const x=curIssue();if(!x||fbBusy)return;
  const intent=document.getElementById("fbIntent").value.trim().slice(0,1000);
  if(!intent){toast("PO 의도를 한 줄 적어 주세요.");document.getElementById("fbIntent").focus();return;}
  if(!MCP){let ok=true;try{await navigator.clipboard.writeText(intent);}catch(e){ok=false;}
    document.getElementById("fbdlg").close();toast(ok?"복사했어요. 사내 페이지에서 같은 문제 ❌에 붙여 넣어 전달해 주세요.":"사내 페이지에서 같은 문제 ❌로 전달해 주세요.");
    if(ARTURL) window.open(ARTURL,"_blank","noopener"); return;}
  fbBusy=true; const btn=document.getElementById("fbSave"); btn.disabled=true; btn.textContent="전달 중…";
  try{await sendNotion(x,intent); setS("fb:"+x.id,"n"); document.getElementById("fbdlg").close(); toast("노션 의견함에 저장했어요. 목요일 13시에 반영돼요.");}
  catch(e){const c=e&&e.code; toast(FBERR[c]||(c==="server_unavailable"||c==="upstream_error"?"저장됐는지 확실하지 않아요. 노션 「처리 현황」에서 확인한 뒤 없으면 다시 눌러 주세요.":"전달하지 못했어요. 잠시 뒤 다시 눌러 주세요."));}
  finally{fbBusy=false;btn.disabled=false;btn.textContent="전달하기";}});
document.getElementById("jiraClose").addEventListener("click",()=>document.getElementById("jira").close());
document.getElementById("jiraCopy").addEventListener("click",async()=>{const ta=document.getElementById("jiraTxt");try{await navigator.clipboard.writeText(ta.value);toast("복사했어요.");}catch(e){ta.select();toast("선택했어요. Cmd+C로 복사하세요.");}});
if(NF.board){document.getElementById("fbBoard").href=NF.board;}else{document.getElementById("fbBoard").hidden=true;}
document.getElementById("stamp").textContent=(D.meta.version?D.meta.version+" · ":"")+D.meta.stamp;
const q=new URLSearchParams(location.search); if(q.get("branch")==="existing") branch="기가입";
const HT={stay:"자리스테이팀",refund:"환급팀",pay:"자리페이팀",growth:"그로스팀",brokerage:"중개팀",core:"코어팀",master:"마스터팀"};
const qh=(location.hash||"").replace(/^#t-/,""); const qt=q.get("team")||HT[qh]||null; if(qt){ const m=SUM_TEAMS.find(x=>x===qt||x.startsWith(qt)); if(m) gTeam=m; }
if(q.get("branch")==="new") branch="신규"; if(gTeam) tGroup=TEAM_GROUP[gTeam]||"기존";
initFB(); renderTeamBar(); renderFilters(); selIssue(ISS()[0]?.id); setView(q.get("view")||"summary");
</script>
